name: PR preview cleanup

# PR を閉じたら (マージ含む)、preview.yml が上げた pr-<番号> のプレビューを
# Cloudflare Pages から消す。残っていても noindex だが、URL を知っている人
# には仮データのページが見え続けるため。
#
# fork PR でも secrets が要るので pull_request_target で動かす。PR のコードは
# checkout も実行もしない (Cloudflare API と GitHub API を叩くだけ)。PR 番号は
# GitHub が付ける値なので、preview.yml のような検証は要らない。
#
# workflow_dispatch は、この仕組みより前に閉じた PR の残骸を手で消す用。
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: プレビューを消す PR の番号
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # preview.yml の deploy と同じ group。デプロイ中に閉じられたら、それが
    # 終わってから消す (先に消して後から上がるのを防ぐ)。cleanup 自身は
    # 打ち切らせない。手動実行は head が分からないので別 group になる。
    concurrency:
      group: preview-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref || github.run_id }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.number || inputs.pr }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      # 手動実行で開いている PR を指定すると、次の push で復活するうえに
      # コメントも「削除した」になってしまうので止める。
      - name: Validate PR number
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid PR number: $PR_NUMBER"
            exit 1
          fi
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .state)
          if [ "$state" = open ]; then
            echo "::error::PR #$PR_NUMBER はまだ開いている"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      # 一覧を先に全部集めてから消す (消しながらページを送ると取りこぼす)。
      # ブランチの最新デプロイにはエイリアス pr-<番号>.<プロジェクト>.pages.dev
      # が付いていて、force=true でないと消せない。
      - name: Delete deployments
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "$api")
          if [ "$status" = 404 ]; then
            echo "プロジェクト $PROJECT が無いので消すものは無い"
            exit 0
          fi
          ids=()
          page=1
          while :; do
            curl -fsS -H "$auth" "$api/deployments?env=preview&page=$page" -o deployments.json
            mapfile -t found < <(jq -r --arg branch "pr-$PR_NUMBER" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' deployments.json)
            ids+=("${found[@]}")
            total=$(jq -r '.result_info.total_pages // 1' deployments.json)
            [ "$page" -ge "$total" ] && break
            page=$((page + 1))
          done
          for id in "${ids[@]}"; do
            curl -fsS -X DELETE -H "$auth" "$api/deployments/$id?force=true" > /dev/null
            echo "deleted $id"
          done
          echo "pr-$PR_NUMBER のデプロイを ${#ids[@]} 件削除した" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 消えたことを外から確かめる。反映に少し時間がかかることがあるので
      # 何度か見て、404 にならなければ warning に留める。
      - name: Verify alias
        run: |
          url="https://pr-$PR_NUMBER.$PROJECT.pages.dev/"
          for _ in 1 2 3 4 5 6; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
            [ "$status" = 404 ] && break
            sleep 10
          done
          echo "$url → $status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 404 ]; then
            echo "::warning::$url がまだ $status を返している"
          fi

      # preview.yml が付けたコメントを書き換え、URL が開けなくなった理由を
      # PR 上で分かるようにする。
      - name: Update preview comment
        run: |
          marker='<!-- pr-preview -->'
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -z "$id" ]; then
            echo "プレビューのコメントが無いので何もしない"
            exit 0
          fi
          body="$marker
          ### プレビュー

          PR が閉じられたので、プレビューは削除しました。"
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
